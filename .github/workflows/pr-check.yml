# ==============================================
# CI - Continuous Integration
# ==============================================
# This workflow runs on every push and pull request
# It checks that the code is formatted and tests pass

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # Job: Check code quality and run tests
  # ============================================
  check:
    name: Check Code
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Check code formatting with Prettier
      - name: Check format
        run: npm run format:check

      # Step 5: Run all tests
      - name: Run tests
        run: npm run test

      # Step 6: Build the project
      - name: Build
        run: npm run build

      # Step 7: Verify library folder was created
      - name: Verify library output
        run: |
          if [ -d "library" ]; then
            echo "✅ Library folder created successfully"
            echo "📁 Contents:"
            ls -la library/
            echo ""
            echo "📁 Components:"
            ls -la library/components/
          else
            echo "❌ Library folder not found"
            exit 1
          fi

      # Step 8: Show library size
      - name: Check library size
        run: |
          SIZE=$(du -sh library | cut -f1)
          echo "📦 Total library size: $SIZE"
